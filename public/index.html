<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>VibeDraw Live Whiteboard</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; touch-action: none; -webkit-touch-callout: none; user-select: none; }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        background: #030712;
        color: #f8fafc;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 10px;
        min-height: 100vh;
      }
      .board-wrap {
        width: 100%;
        max-width: 440px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      h1 { font-size: 1.3rem; color: #38bdf8; }
      .tools-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        background: #0f172a;
        padding: 8px 10px;
        border-radius: 10px;
        border: 1px solid #1e293b;
      }
      .color-dot {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        cursor: pointer;
        border: 2px solid transparent;
      }
      .color-dot.active {
        border-color: #ffffff;
        transform: scale(1.15);
      }
      input[type="range"] {
        width: 60px;
        accent-color: #38bdf8;
      }
      .btn-clear {
        margin-left: auto;
        padding: 6px 12px;
        background: #ef4444;
        border: none;
        border-radius: 6px;
        color: white;
        font-weight: 700;
        font-size: 0.8rem;
        cursor: pointer;
      }
      canvas {
        background: #090d16;
        border: 2px solid #1e293b;
        border-radius: 10px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
        display: block;
        cursor: crosshair;
      }
      .chat-card {
        background: #0f172a;
        border: 1px solid #1e293b;
        border-radius: 10px;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .chat-feed {
        height: 90px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 0.85rem;
      }
      .chat-msg { word-break: break-word; }
      .chat-sender { color: #38bdf8; font-weight: 700; margin-right: 4px; }
      .chat-input-row {
        display: flex;
        gap: 6px;
      }
      input[type="text"] {
        flex: 1;
        padding: 8px;
        background: #030712;
        border: 1px solid #334155;
        border-radius: 6px;
        color: white;
        font-size: 0.85rem;
        outline: none;
      }
      .btn-send {
        background: #0284c7;
        color: white;
        border: none;
        padding: 8px 14px;
        border-radius: 6px;
        font-weight: 700;
        font-size: 0.85rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="board-wrap">
      <header>
        <h1>🎨 VibeDraw Live</h1>
        <span style="font-size: 0.75rem; color: #10b981;">● Online</span>
      </header>

      <div class="tools-bar">
        <div class="color-dot active" style="background:#38bdf8;" onclick="pickColor('#38bdf8', this)"></div>
        <div class="color-dot" style="background:#ef4444;" onclick="pickColor('#ef4444', this)"></div>
        <div class="color-dot" style="background:#10b981;" onclick="pickColor('#10b981', this)"></div>
        <div class="color-dot" style="background:#facc15;" onclick="pickColor('#facc15', this)"></div>
        <div class="color-dot" style="background:#ffffff;" onclick="pickColor('#ffffff', this)"></div>
        <input type="range" id="sizeRange" min="2" max="18" value="4" />
        <button class="btn-clear" onclick="clearBoard()">Clear</button>
      </div>

      <canvas id="drawCanvas" width="360" height="380"></canvas>

      <div class="chat-card">
        <div class="chat-feed" id="chatFeed"></div>
        <div class="chat-input-row">
          <input type="text" id="chatInput" placeholder="Guess word or chat..." />
          <button class="btn-send" onclick="sendChat()">Send</button>
        </div>
      </div>
    </div>

    <script>
      const canvas = document.getElementById('drawCanvas');
      const ctx = canvas.getContext('2d');
      const chatFeed = document.getElementById('chatFeed');
      const chatInput = document.getElementById('chatInput');
      const sizeRange = document.getElementById('sizeRange');

      let brushColor = '#38bdf8';
      let isDrawing = false;
      let lastX = 0;
      let lastY = 0;

      function pickColor(color, el) {
        brushColor = color;
        document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
        el.classList.add('active');
      }

      function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: (clientX - rect.left) * (canvas.width / rect.width),
          y: (clientY - rect.top) * (canvas.height / rect.height)
        };
      }

      function drawSegment(x1, y1, x2, y2, color, size) {
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.strokeStyle = color;
        ctx.lineWidth = size;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.stroke();
      }

      function startDraw(e) {
        e.preventDefault();
        isDrawing = true;
        const p = getPos(e);
        lastX = p.x;
        lastY = p.y;
      }

      function moveDraw(e) {
        if (!isDrawing) return;
        e.preventDefault();
        const p = getPos(e);
        const line = {
          x1: Math.round(lastX),
          y1: Math.round(lastY),
          x2: Math.round(p.x),
          y2: Math.round(p.y),
          color: brushColor,
          size: parseInt(sizeRange.value, 10)
        };

        drawSegment(line.x1, line.y1, line.x2, line.y2, line.color, line.size);
        lastX = p.x;
        lastY = p.y;

        fetch('/api/draw', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ line })
        }).catch(() => {});
      }

      function stopDraw() { isDrawing = false; }

      canvas.addEventListener('touchstart', startDraw, { passive: false });
      canvas.addEventListener('touchmove', moveDraw, { passive: false });
      canvas.addEventListener('touchend', stopDraw);
      canvas.addEventListener('mousedown', startDraw);
      window.addEventListener('mousemove', moveDraw);
      window.addEventListener('mouseup', stopDraw);

      async function clearBoard() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        await fetch('/api/clear', { method: 'POST' });
        syncBoard();
      }

      async function syncBoard() {
        try {
          const res = await fetch('/api/board');
          const data = await res.json();

          // Redraw lines
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          data.lines.forEach(l => {
            drawSegment(l.x1, l.y1, l.x2, l.y2, l.color, l.size);
          });

          // Update Chat
          chatFeed.innerHTML = data.chat.map(m => `
            <div class="chat-msg">
              <span class="chat-sender">${m.sender}:</span>${m.text}
            </div>
          `).join('');
        } catch (e) {}
      }

      async function sendChat() {
        const text = chatInput.value.trim();
        if (!text) return;
        chatInput.value = '';
        await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            sender: /iPhone|Android/i.test(navigator.userAgent) ? 'Phone' : 'PC',
            text
          })
        });
        syncBoard();
      }

      chatInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') sendChat();
      });

      // Poll updates every 1.5s
      syncBoard();
      setInterval(syncBoard, 1500);
    </script>
  </body>
</html>
