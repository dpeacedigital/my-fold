<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Cyber Dash Arcade</title>
    <style>
      * { box-sizing: border-box; touch-action: manipulation; }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        background: #030712;
        color: #f3f4f6;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow: hidden;
      }
      .arcade-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        max-width: 420px;
        padding: 12px;
      }
      .header-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        margin-bottom: 8px;
        font-weight: 700;
        font-size: 1.05rem;
      }
      .score-val { color: #38bdf8; }
      .high-val { color: #f59e0b; }
      .action-row {
        display: flex;
        gap: 8px;
        margin-top: 10px;
        width: 100%;
      }
      .pause-btn {
        flex: 1;
        padding: 10px;
        font-size: 0.95rem;
        font-weight: 700;
        background: #334155;
        color: #f8fafc;
        border: 1px solid #475569;
        border-radius: 8px;
        cursor: pointer;
      }
      .pause-btn:hover { background: #475569; }
      canvas {
        background: #0f172a;
        border: 2px solid #1e293b;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        display: block;
      }
      .touch-controls {
        display: flex;
        gap: 16px;
        margin-top: 10px;
        width: 100%;
      }
      .touch-btn {
        flex: 1;
        padding: 16px;
        font-size: 1.25rem;
        font-weight: bold;
        background: #1e293b;
        color: #38bdf8;
        border: 1px solid #334155;
        border-radius: 10px;
        user-select: none;
        cursor: pointer;
      }
      .touch-btn:active { background: #38bdf8; color: #0f172a; }
      .hint {
        font-size: 0.8rem;
        color: #64748b;
        margin-top: 8px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="arcade-container">
      <div class="header-bar">
        <span>Score: <span id="scoreDisplay" class="score-val">0</span></span>
        <span>Best: <span id="highDisplay" class="high-val">0</span></span>
      </div>

      <canvas id="gameCanvas" width="360" height="480"></canvas>

      <div class="action-row">
        <button class="pause-btn" id="pauseBtn" onclick="togglePause()">⏸ Pause</button>
      </div>

      <!-- Touch Controls for Phones -->
      <div class="touch-controls">
        <button class="touch-btn" id="leftBtn">◀ Left</button>
        <button class="touch-btn" id="rightBtn">Right ▶</button>
      </div>
      <div class="hint">Keyboard: A/D or Arrows | P to Pause</div>
    </div>

    <script>
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('scoreDisplay');
      const highEl = document.getElementById('highDisplay');
      const pauseBtn = document.getElementById('pauseBtn');

      let bestScore = localStorage.getItem('vibe_high_score') || 0;
      highEl.textContent = bestScore;

      let player = { x: 160, y: 430, width: 40, height: 18, speed: 6 };
      let obstacles = [];
      let bonuses = [];
      let score = 0;
      let gameOver = false;
      let isPaused = false;
      let frame = 0;
      let leftPressed = false;
      let rightPressed = false;

      function spawnObstacle() {
        const size = Math.random() * 20 + 20;
        const x = Math.random() * (canvas.width - size);
        const speed = 2.5 + Math.min(score * 0.05, 5);
        obstacles.push({ x, y: -size, size, speed });
      }

      function spawnBonus() {
        const x = Math.random() * (canvas.width - 16);
        bonuses.push({ x, y: -16, size: 14, speed: 2 });
      }

      function resetGame() {
        player.x = 160;
        obstacles = [];
        bonuses = [];
        score = 0;
        scoreEl.textContent = score;
        gameOver = false;
        isPaused = false;
        pauseBtn.textContent = '⏸ Pause';
        requestAnimationFrame(gameLoop);
      }

      function togglePause() {
        if (gameOver) return;
        isPaused = !isPaused;
        if (isPaused) {
          pauseBtn.textContent = '▶ Resume';
          drawPausedScreen();
        } else {
          pauseBtn.textContent = '⏸ Pause';
          requestAnimationFrame(gameLoop);
        }
      }

      // Keyboard events
      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') leftPressed = true;
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') rightPressed = true;
        if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') togglePause();
        if (gameOver && (e.key === ' ' || e.key === 'Enter')) resetGame();
      });

      window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') leftPressed = false;
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') rightPressed = false;
      });

      // Touch controls
      const lBtn = document.getElementById('leftBtn');
      const rBtn = document.getElementById('rightBtn');

      lBtn.addEventListener('touchstart', (e) => { e.preventDefault(); leftPressed = true; });
      lBtn.addEventListener('touchend', () => { leftPressed = false; });
      rBtn.addEventListener('touchstart', (e) => { e.preventDefault(); rightPressed = true; });
      rBtn.addEventListener('touchend', () => { rightPressed = false; });

      lBtn.addEventListener('mousedown', () => { leftPressed = true; });
      lBtn.addEventListener('mouseup', () => { leftPressed = false; });
      rBtn.addEventListener('mousedown', () => { rightPressed = true; });
      rBtn.addEventListener('mouseup', () => { rightPressed = false; });

      canvas.addEventListener('click', () => {
        if (gameOver) resetGame();
      });

      function update() {
        if (leftPressed && player.x > 0) player.x -= player.speed;
        if (rightPressed && player.x + player.width < canvas.width) player.x += player.speed;

        frame++;
        if (frame % Math.max(25, 60 - Math.floor(score * 0.4)) === 0) spawnObstacle();
        if (frame % 180 === 0) spawnBonus();

        for (let i = obstacles.length - 1; i >= 0; i--) {
          const obs = obstacles[i];
          obs.y += obs.speed;

          if (
            player.x < obs.x + obs.size &&
            player.x + player.width > obs.x &&
            player.y < obs.y + obs.size &&
            player.y + player.height > obs.y
          ) {
            gameOver = true;
            if (score > bestScore) {
              bestScore = score;
              localStorage.setItem('vibe_high_score', bestScore);
              highEl.textContent = bestScore;
            }
          }

          if (obs.y > canvas.height) {
            obstacles.splice(i, 1);
            score += 1;
            scoreEl.textContent = score;
          }
        }

        for (let j = bonuses.length - 1; j >= 0; j--) {
          const b = bonuses[j];
          b.y += b.speed;

          if (
            player.x < b.x + b.size &&
            player.x + player.width > b.x &&
            player.y < b.y + b.size &&
            player.y + player.height > b.y
          ) {
            bonuses.splice(j, 1);
            score += 5;
            scoreEl.textContent = score;
          } else if (b.y > canvas.height) {
            bonuses.splice(j, 1);
          }
        }
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Player
        ctx.fillStyle = '#38bdf8';
        ctx.beginPath();
        ctx.roundRect(player.x, player.y, player.width, player.height, 6);
        ctx.fill();

        // Obstacles
        ctx.fillStyle = '#ef4444';
        obstacles.forEach((obs) => {
          ctx.beginPath();
          ctx.roundRect(obs.x, obs.y, obs.size, obs.size, 4);
          ctx.fill();
        });

        // Bonuses
        ctx.fillStyle = '#10b981';
        bonuses.forEach((b) => {
          ctx.beginPath();
          ctx.arc(b.x + b.size / 2, b.y + b.size / 2, b.size / 2, 0, Math.PI * 2);
          ctx.fill();
        });

        if (gameOver) {
          ctx.fillStyle = 'rgba(3, 7, 18, 0.85)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          ctx.fillStyle = '#f87171';
          ctx.font = 'bold 26px system-ui';
          ctx.textAlign = 'center';
          ctx.fillText('CRASHED!', canvas.width / 2, 220);

          ctx.fillStyle = '#f3f4f6';
          ctx.font = '16px system-ui';
          ctx.fillText('Score: ' + score, canvas.width / 2, 255);

          ctx.fillStyle = '#38bdf8';
          ctx.font = '14px system-ui';
          ctx.fillText('Tap screen or press Enter to restart', canvas.width / 2, 290);
        }
      }

      function drawPausedScreen() {
        ctx.fillStyle = 'rgba(3, 7, 18, 0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 28px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText('PAUSED', canvas.width / 2, 230);

        ctx.fillStyle = '#94a3b8';
        ctx.font = '14px system-ui';
        ctx.fillText('Click Resume or press P to continue', canvas.width / 2, 260);
      }

      function gameLoop() {
        if (!gameOver && !isPaused) {
          update();
          draw();
          requestAnimationFrame(gameLoop);
        }
      }

      requestAnimationFrame(gameLoop);
    </script>
  </body>
</html>
