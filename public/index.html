<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>VibeStudio Photo Editor</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        background-color: #030712;
        color: #f8fafc;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 16px 12px;
        min-height: 100vh;
      }
      .app-shell {
        width: 100%;
        max-width: 440px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      h1 { font-size: 1.35rem; color: #38bdf8; }
      .canvas-viewport {
        width: 100%;
        height: 340px;
        background: #0f172a;
        border: 2px dashed #334155;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
      }
      canvas {
        max-width: 100%;
        max-height: 100%;
        border-radius: 8px;
        display: block;
      }
      .upload-prompt {
        text-align: center;
        color: #94a3b8;
        font-size: 0.9rem;
        cursor: pointer;
        padding: 20px;
      }
      .file-input { display: none; }
      .filter-scroll {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 4px;
      }
      .filter-btn {
        background: #1e293b;
        color: #94a3b8;
        border: 1px solid #334155;
        padding: 8px 14px;
        border-radius: 20px;
        font-size: 0.8rem;
        font-weight: 700;
        white-space: nowrap;
        cursor: pointer;
      }
      .filter-btn.active {
        background: #0284c7;
        color: #ffffff;
        border-color: #38bdf8;
      }
      .controls-card {
        background: #0f172a;
        border: 1px solid #1e293b;
        border-radius: 12px;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .slider-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.8rem;
        color: #94a3b8;
      }
      input[type="range"] {
        width: 60%;
        accent-color: #38bdf8;
      }
      .sticker-tray {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .sticker-btn {
        background: #1e293b;
        border: 1px solid #334155;
        font-size: 1.25rem;
        border-radius: 8px;
        padding: 6px 12px;
        cursor: pointer;
      }
      .action-row {
        display: flex;
        gap: 8px;
      }
      .action-btn {
        flex: 1;
        padding: 12px;
        border-radius: 8px;
        border: none;
        font-weight: 800;
        font-size: 0.9rem;
        cursor: pointer;
      }
      .btn-upload { background: #334155; color: white; }
      .btn-download { background: #10b981; color: #022c22; }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <header>
        <h1>✨ VibeStudio</h1>
        <span style="font-size: 0.8rem; color: #64748b;">Photo & Meme Lab</span>
      </header>

      <div class="canvas-viewport" id="viewport" onclick="triggerFileInput()">
        <canvas id="photoCanvas"></canvas>
        <div class="upload-prompt" id="promptText">
          📷 Tap here to upload a photo or snap a picture
        </div>
      </div>

      <input type="file" id="imageLoader" class="file-input" accept="image/*" onchange="handleImage(event)" />

      <!-- Aesthetic Filters Bar -->
      <div class="filter-scroll">
        <button class="filter-btn active" onclick="applyPreset('normal', this)">Normal</button>
        <button class="filter-btn" onclick="applyPreset('cyber', this)">Cyberpunk Neon</button>
        <button class="filter-btn" onclick="applyPreset('vintage', this)">90s Warm Film</button>
        <button class="filter-btn" onclick="applyPreset('noir', this)">Noir B&W</button>
        <button class="filter-btn" onclick="applyPreset('invert', this)">Matrix Invert</button>
      </div>

      <!-- Fine-Tune Sliders -->
      <div class="controls-card">
        <div class="slider-row">
          <span>Brightness</span>
          <input type="range" id="bRange" min="50" max="180" value="100" oninput="renderPhoto()" />
        </div>
        <div class="slider-row">
          <span>Contrast</span>
          <input type="range" id="cRange" min="50" max="200" value="100" oninput="renderPhoto()" />
        </div>
        <div class="slider-row">
          <span>Saturation</span>
          <input type="range" id="sRange" min="0" max="250" value="100" oninput="renderPhoto()" />
        </div>
      </div>

      <!-- Fun Stickers & Memes -->
      <div class="controls-card">
        <span style="font-size: 0.75rem; color: #64748b; font-weight: 700; text-transform: uppercase;">Tap to stamp emoji sticker:</span>
        <div class="sticker-tray">
          <button class="sticker-btn" onclick="addSticker('🕶️')">🕶️</button>
          <button class="sticker-btn" onclick="addSticker('🔥')">🔥</button>
          <button class="sticker-btn" onclick="addSticker('👑')">👑</button>
          <button class="sticker-btn" onclick="addSticker('⚡')">⚡</button>
          <button class="sticker-btn" onclick="addSticker('👽')">👽</button>
          <button class="sticker-btn" onclick="clearStickers()" style="font-size: 0.8rem; flex: 1; padding: 10px;">Clear Stickers</button>
        </div>
      </div>

      <div class="action-row">
        <button class="action-btn btn-upload" onclick="triggerFileInput()">🔄 Change Photo</button>
        <button class="action-btn btn-download" onclick="downloadImage()">💾 Save Photo</button>
      </div>
    </div>

    <script>
      const canvas = document.getElementById('photoCanvas');
      const ctx = canvas.getContext('2d');
      const promptText = document.getElementById('promptText');
      const fileInput = document.getElementById('imageLoader');

      let currentImg = null;
      let activePreset = 'normal';
      let stickers = [];
      let draggedSticker = null;

      function triggerFileInput() {
        if (!currentImg) fileInput.click();
      }

      function handleImage(e) {
        const reader = new FileReader();
        reader.onload = function(event) {
          const img = new Image();
          img.onload = function() {
            currentImg = img;
            promptText.style.display = 'none';

            // Scale canvas to fit image proportions comfortably
            const maxW = 380;
            const maxH = 340;
            let w = img.width;
            let h = img.height;

            const ratio = Math.min(maxW / w, maxH / h);
            canvas.width = w * ratio;
            canvas.height = h * ratio;

            stickers = [];
            renderPhoto();
          };
          img.src = event.target.result;
        };
        if (e.target.files[0]) {
          reader.readAsDataURL(e.target.files[0]);
        }
      }

      function applyPreset(name, btn) {
        activePreset = name;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        if (btn) btn.classList.add('active');
        renderPhoto();
      }

      function renderPhoto() {
        if (!currentImg) return;

        const b = document.getElementById('bRange').value;
        const c = document.getElementById('cRange').value;
        const s = document.getElementById('sRange').value;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();

        let filterString = `brightness(${b}%) contrast(${c}%) saturate(${s}%) `;

        if (activePreset === 'cyber') {
          filterString += 'hue-rotate(180deg) saturate(180%) contrast(120%)';
        } else if (activePreset === 'vintage') {
          filterString += 'sepia(50%) contrast(90%) brightness(105%)';
        } else if (activePreset === 'noir') {
          filterString += 'grayscale(100%) contrast(140%)';
        } else if (activePreset === 'invert') {
          filterString += 'invert(100%) hue-rotate(90deg)';
        }

        ctx.filter = filterString;
        ctx.drawImage(currentImg, 0, 0, canvas.width, canvas.height);
        ctx.restore();

        // Render stamps/stickers on top
        stickers.forEach(stk => {
          ctx.font = `${stk.size}px serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(stk.emoji, stk.x, stk.y);
        });
      }

      function addSticker(emoji) {
        if (!currentImg) return;
        stickers.push({
          emoji,
          x: canvas.width / 2 + (Math.random() - 0.5) * 40,
          y: canvas.height / 2 + (Math.random() - 0.5) * 40,
          size: 40
        });
        renderPhoto();
      }

      function clearStickers() {
        stickers = [];
        renderPhoto();
      }

      // Drag Stickers on Screen (Finger Touch or Mouse)
      function getCanvasCoordinates(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: (clientX - rect.left) * (canvas.width / rect.width),
          y: (clientY - rect.top) * (canvas.height / rect.height)
        };
      }

      function onPointerDown(e) {
        if (!currentImg) return;
        const pos = getCanvasCoordinates(e);
        for (let i = stickers.length - 1; i >= 0; i--) {
          const stk = stickers[i];
          if (Math.hypot(stk.x - pos.x, stk.y - pos.y) < stk.size / 1.5) {
            draggedSticker = stk;
            break;
          }
        }
      }

      function onPointerMove(e) {
        if (!draggedSticker) return;
        const pos = getCanvasCoordinates(e);
        draggedSticker.x = pos.x;
        draggedSticker.y = pos.y;
        renderPhoto();
      }

      function onPointerUp() {
        draggedSticker = null;
      }

      canvas.addEventListener('mousedown', onPointerDown);
      window.addEventListener('mousemove', onPointerMove);
      window.addEventListener('mouseup', onPointerUp);

      canvas.addEventListener('touchstart', onPointerDown, { passive: true });
      window.addEventListener('touchmove', onPointerMove, { passive: true });
      window.addEventListener('touchend', onPointerUp);

      function downloadImage() {
        if (!currentImg) return;
        const a = document.createElement('a');
        a.download = 'vibestudio-masterpiece.png';
        a.href = canvas.toDataURL('image/png');
        a.click();
      }
    </script>
  </body>
</html>
