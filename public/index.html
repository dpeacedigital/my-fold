<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>FlashQR Studio</title>
    <!-- Lightweight, trusted open-source engines for QR creation & scanning -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        background-color: #030712;
        color: #f8fafc;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px 16px;
        min-height: 100vh;
      }
      .container {
        width: 100%;
        max-width: 440px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .tab-bar {
        display: flex;
        background: #111827;
        border: 1px solid #1f2937;
        border-radius: 10px;
        padding: 4px;
        gap: 4px;
      }
      .tab-btn {
        flex: 1;
        padding: 10px;
        background: transparent;
        border: none;
        color: #94a3b8;
        font-weight: 700;
        font-size: 0.9rem;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .tab-btn.active {
        background: #0284c7;
        color: #ffffff;
      }
      .card {
        background: #0f172a;
        border: 1px solid #1e293b;
        border-radius: 14px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      }
      label {
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      input[type="text"], textarea {
        width: 100%;
        padding: 12px;
        background: #030712;
        border: 1px solid #334155;
        border-radius: 8px;
        color: #f8fafc;
        font-size: 0.95rem;
        outline: none;
      }
      input[type="text"]:focus, textarea:focus {
        border-color: #38bdf8;
      }
      .color-options {
        display: flex;
        gap: 12px;
      }
      .color-field {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      input[type="color"] {
        width: 100%;
        height: 38px;
        border-radius: 6px;
        border: 1px solid #334155;
        background: #030712;
        cursor: pointer;
      }
      .qr-output-area {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: #030712;
        border: 1px solid #1e293b;
        border-radius: 10px;
        min-height: 230px;
      }
      #qrcode img, #qrcode canvas {
        border-radius: 8px;
        max-width: 100%;
      }
      .action-btn {
        padding: 12px;
        background: #0284c7;
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: 700;
        font-size: 0.95rem;
        cursor: pointer;
        transition: background 0.15s ease;
      }
      .action-btn:hover { background: #0369a1; }
      .scanner-window {
        width: 100%;
        border-radius: 10px;
        overflow: hidden;
      }
      .scan-result-box {
        background: #030712;
        border: 1px solid #1e293b;
        border-radius: 8px;
        padding: 12px;
        font-size: 0.9rem;
        word-break: break-all;
        color: #38bdf8;
        min-height: 48px;
        display: flex;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div style="text-align: center; margin-bottom: 4px;">
        <h1 style="color: #38bdf8; font-size: 1.5rem;">⚡ FlashQR Studio</h1>
        <p style="color: #64748b; font-size: 0.85rem;">Fast Generator & Camera Scanner</p>
      </div>

      <div class="tab-bar">
        <button class="tab-btn active" id="btnTabGen" onclick="switchTab('generate')">Create Code</button>
        <button class="tab-btn" id="btnTabScan" onclick="switchTab('scan')">Live Scanner</button>
      </div>

      <!-- Generator Section -->
      <div class="card" id="genSection">
        <div>
          <label>Target Content / URL</label>
          <input type="text" id="qrText" value="https://railway.app" placeholder="Paste website, phone number, or text" oninput="renderQR()" />
        </div>

        <div class="color-options">
          <div class="color-field">
            <label>Code Color</label>
            <input type="color" id="qrColorDark" value="#000000" onchange="renderQR()" />
          </div>
          <div class="color-field">
            <label>Background</label>
            <input type="color" id="qrColorLight" value="#ffffff" onchange="renderQR()" />
          </div>
        </div>

        <div class="qr-output-area">
          <div id="qrcode"></div>
        </div>

        <button class="action-btn" onclick="saveQRCode()">💾 Download PNG Image</button>
      </div>

      <!-- Scanner Section -->
      <div class="card" id="scanSection" style="display: none;">
        <div id="scannerReader" class="scanner-window"></div>
        <button class="action-btn" id="startCamBtn" onclick="toggleCameraScanner()">📷 Start Camera</button>

        <div>
          <label>Scanned Detection</label>
          <div class="scan-result-box" id="scanOutput">Camera is inactive. Tap start to scan.</div>
        </div>
      </div>
    </div>

    <script>
      let qrEngine = null;
      let html5QrScanner = null;
      let scannerRunning = false;

      function renderQR() {
        const text = document.getElementById('qrText').value.trim() || ' ';
        const colorDark = document.getElementById('qrColorDark').value;
        const colorLight = document.getElementById('qrColorLight').value;
        const container = document.getElementById('qrcode');

        container.innerHTML = '';
        qrEngine = new QRCode(container, {
          text: text,
          width: 190,
          height: 190,
          colorDark: colorDark,
          colorLight: colorLight,
          correctLevel: QRCode.CorrectLevel.H
        });
      }

      function saveQRCode() {
        const img = document.querySelector('#qrcode img');
        if (img && img.src) {
          const a = document.createElement('a');
          a.href = img.src;
          a.download = 'flashqr-code.png';
          a.click();
        } else {
          const canvas = document.querySelector('#qrcode canvas');
          if (canvas) {
            const a = document.createElement('a');
            a.href = canvas.toDataURL('image/png');
            a.download = 'flashqr-code.png';
            a.click();
          }
        }
      }

      function switchTab(mode) {
        const genSec = document.getElementById('genSection');
        const scanSec = document.getElementById('scanSection');
        const btnGen = document.getElementById('btnTabGen');
        const btnScan = document.getElementById('btnTabScan');

        if (mode === 'generate') {
          genSec.style.display = 'flex';
          scanSec.style.display = 'none';
          btnGen.classList.add('active');
          btnScan.classList.remove('active');
          stopScanner();
        } else {
          genSec.style.display = 'none';
          scanSec.style.display = 'flex';
          btnGen.classList.remove('active');
          btnScan.classList.add('active');
        }
      }

      function toggleCameraScanner() {
        if (scannerRunning) {
          stopScanner();
        } else {
          startScanner();
        }
      }

      function startScanner() {
        const btn = document.getElementById('startCamBtn');
        const output = document.getElementById('scanOutput');
        output.textContent = 'Point your lens at any QR code...';

        html5QrScanner = new Html5Qrcode('scannerReader');
        html5QrScanner.start(
          { facingMode: 'environment' },
          { fps: 10, qrbox: { width: 220, height: 220 } },
          (decodedText) => {
            output.textContent = decodedText;
            if (decodedText.startsWith('http://') || decodedText.startsWith('https://')) {
              output.innerHTML = `<a href="${decodedText}" target="_blank" style="color: #38bdf8; text-decoration: underline;">${decodedText} ↗</a>`;
            }
            stopScanner();
          },
          () => {} // suppress read frame misses
        ).then(() => {
          scannerRunning = true;
          btn.textContent = '🛑 Stop Camera';
          btn.style.background = '#ef4444';
        }).catch((err) => {
          output.textContent = 'Camera error: ' + err;
        });
      }

      function stopScanner() {
        if (html5QrScanner && scannerRunning) {
          html5QrScanner.stop().then(() => {
            html5QrScanner.clear();
            scannerRunning = false;
            const btn = document.getElementById('startCamBtn');
            if (btn) {
              btn.textContent = '📷 Start Camera';
              btn.style.background = '#0284c7';
            }
          }).catch(() => {});
        }
      }

      // Initial render on load
      renderQR();
    </script>
  </body>
</html>
