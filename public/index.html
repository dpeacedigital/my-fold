<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SoundPulse - Beat Sequencer</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        touch-action: manipulation;
        user-select: none;
      }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        background-color: #0b0f19;
        color: #f8fafc;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 16px 12px;
        min-height: 100vh;
      }
      .app-wrapper {
        width: 100%;
        max-width: 520px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      h1 {
        font-size: 1.4rem;
        color: #38bdf8;
      }
      .controls-bar {
        display: flex;
        gap: 10px;
        align-items: center;
        background: #151d30;
        padding: 12px;
        border-radius: 12px;
        border: 1px solid #1e293b;
      }
      .btn-play {
        background: #10b981;
        color: #022c22;
        border: none;
        padding: 10px 18px;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 800;
        cursor: pointer;
      }
      .btn-play.playing {
        background: #ef4444;
        color: white;
      }
      .tempo-wrap {
        display: flex;
        flex-direction: column;
        flex: 1;
        gap: 4px;
      }
      .tempo-label {
        font-size: 0.75rem;
        color: #94a3b8;
        display: flex;
        justify-content: space-between;
      }
      input[type="range"] {
        accent-color: #38bdf8;
      }
      .preset-bar {
        display: flex;
        gap: 6px;
      }
      .btn-preset {
        flex: 1;
        background: #1e293b;
        color: #94a3b8;
        border: 1px solid #334155;
        padding: 8px 0;
        font-size: 0.75rem;
        font-weight: 700;
        border-radius: 6px;
        cursor: pointer;
      }
      .btn-preset:active {
        background: #334155;
        color: white;
      }

      /* Sequencer Grid */
      .sequencer {
        background: #151d30;
        border: 1px solid #1e293b;
        border-radius: 12px;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        overflow-x: auto;
      }
      .track-row {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .track-label {
        width: 60px;
        font-size: 0.75rem;
        font-weight: 700;
        color: #94a3b8;
        cursor: pointer;
        text-align: right;
        padding-right: 6px;
      }
      .track-label:hover {
        color: #38bdf8;
      }
      .steps {
        display: flex;
        gap: 4px;
        flex: 1;
      }
      .step {
        flex: 1;
        height: 28px;
        min-width: 18px;
        background: #0b0f19;
        border: 1px solid #1e293b;
        border-radius: 4px;
        cursor: pointer;
        transition: transform 0.05s;
      }
      .step:nth-child(4n + 1) {
        border-left: 2px solid #334155;
      }
      .step.active {
        background: #38bdf8;
        box-shadow: 0 0 8px rgba(56, 189, 248, 0.5);
      }
      .step.current {
        border-color: #facc15;
        transform: scale(1.08);
      }
      .step.active.current {
        background: #facc15;
      }
      .hint {
        font-size: 0.75rem;
        color: #64748b;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="app-wrapper">
      <div class="header">
        <h1>🎹 SoundPulse</h1>
        <span style="font-size: 0.8rem; color: #94a3b8;">16-Step Looper</span>
      </div>

      <div class="controls-bar">
        <button id="playBtn" class="btn-play" onclick="togglePlay()">▶ Play</button>
        <div class="tempo-wrap">
          <div class="tempo-label">
            <span>TEMPO</span>
            <span id="bpmText">120 BPM</span>
          </div>
          <input type="range" id="bpmSlider" min="70" max="160" value="120" oninput="updateBpm(this.value)" />
        </div>
      </div>

      <div class="preset-bar">
        <button class="btn-preset" onclick="loadPreset('trap')">🔥 Trap Groove</button>
        <button class="btn-preset" onclick="loadPreset('house')">⚡ 4x4 Beat</button>
        <button class="btn-preset" onclick="clearAll()">🧹 Clear All</button>
      </div>

      <div class="sequencer" id="seqContainer"></div>

      <div class="hint">Tap any track label to test its sound directly</div>
    </div>

    <script>
      let audioCtx = null;
      let isPlaying = false;
      let currentStep = 0;
      let bpm = 120;
      let intervalId = null;

      function initAudio() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      }

      // Synthesizer Instruments
      const instruments = [
        {
          name: 'Kick',
          play: (t) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.setValueAtTime(140, t);
            osc.frequency.exponentialRampToValueAtTime(35, t + 0.12);
            gain.gain.setValueAtTime(0.8, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(t);
            osc.stop(t + 0.15);
          }
        },
        {
          name: 'Snare',
          play: (t) => {
            // White noise burst + tone
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(220, t);
            gain.gain.setValueAtTime(0.3, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(t);
            osc.stop(t + 0.12);
          }
        },
        {
          name: 'Hi-Hat',
          play: (t) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(900, t);
            gain.gain.setValueAtTime(0.2, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(t);
            osc.stop(t + 0.04);
          }
        },
        {
          name: 'Clap',
          play: (t) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(450, t);
            gain.gain.setValueAtTime(0.25, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(t);
            osc.stop(t + 0.1);
          }
        },
        {
          name: 'Bass',
          play: (t) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(65, t);
            gain.gain.setValueAtTime(0.5, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(t);
            osc.stop(t + 0.2);
          }
        },
        {
          name: 'Laser',
          play: (t) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(880, t);
            osc.frequency.exponentialRampToValueAtTime(200, t + 0.1);
            gain.gain.setValueAtTime(0.2, t);
            gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(t);
            osc.stop(t + 0.1);
          }
        }
      ];

      // Grid Pattern Matrix (6 instruments x 16 steps)
      let grid = instruments.map(() => Array(16).fill(false));

      function buildGridUI() {
        const container = document.getElementById('seqContainer');
        container.innerHTML = '';

        instruments.forEach((inst, rIdx) => {
          const row = document.createElement('div');
          row.className = 'track-row';

          const label = document.createElement('div');
          label.className = 'track-label';
          label.textContent = inst.name;
          label.onclick = () => {
            initAudio();
            inst.play(audioCtx.currentTime);
          };

          const steps = document.createElement('div');
          steps.className = 'steps';

          for (let c = 0; c < 16; c++) {
            const step = document.createElement('div');
            step.className = 'step' + (grid[rIdx][c] ? ' active' : '');
            step.dataset.row = rIdx;
            step.dataset.col = c;
            step.onclick = () => {
              initAudio();
              grid[rIdx][c] = !grid[rIdx][c];
              step.classList.toggle('active', grid[rIdx][c]);
            };
            steps.appendChild(step);
          }

          row.appendChild(label);
          row.appendChild(steps);
          container.appendChild(row);
        });
      }

      function stepTick() {
        const time = audioCtx.currentTime;

        // Visual highlights
        document.querySelectorAll('.step.current').forEach(el => el.classList.remove('current'));
        document.querySelectorAll(`.step[data-col="${currentStep}"]`).forEach(el => el.classList.add('current'));

        // Play active sounds
        instruments.forEach((inst, rIdx) => {
          if (grid[rIdx][currentStep]) {
            inst.play(time);
          }
        });

        currentStep = (currentStep + 1) % 16;
      }

      function togglePlay() {
        initAudio();
        const btn = document.getElementById('playBtn');

        if (isPlaying) {
          clearInterval(intervalId);
          isPlaying = false;
          btn.textContent = '▶ Play';
          btn.classList.remove('playing');
          document.querySelectorAll('.step.current').forEach(el => el.classList.remove('current'));
          currentStep = 0;
        } else {
          isPlaying = true;
          btn.textContent = '⏹ Stop';
          btn.classList.add('playing');
          const intervalMs = (60 / bpm / 4) * 1000;
          stepTick();
          intervalId = setInterval(stepTick, intervalMs);
        }
      }

      function updateBpm(val) {
        bpm = parseInt(val, 10);
        document.getElementById('bpmText').textContent = bpm + ' BPM';
        if (isPlaying) {
          clearInterval(intervalId);
          intervalId = setInterval(stepTick, (60 / bpm / 4) * 1000);
        }
      }

      function clearAll() {
        grid = instruments.map(() => Array(16).fill(false));
        buildGridUI();
      }

      function loadPreset(type) {
        clearAll();
        if (type === 'house') {
          // Four on the floor Kick
          [0, 4, 8, 12].forEach(s => grid[0][s] = true);
          // Snare/Clap on 4, 12
          [4, 12].forEach(s => grid[3][s] = true);
          // Offbeat Hi-Hats
          [2, 6, 10, 14].forEach(s => grid[2][s] = true);
          // Bass groove
          [0, 3, 6, 10, 14].forEach(s => grid[4][s] = true);
          updateBpm(124);
        } else if (type === 'trap') {
          // Trap Kick pattern
          [0, 7, 10].forEach(s => grid[0][s] = true);
          // Snare on beat 8
          [8].forEach(s => grid[1][s] = true);
          // Fast rolling hats
          [0, 2, 4, 6, 8, 10, 12, 13, 14, 15].forEach(s => grid[2][s] = true);
          // Laser blip accent
          [14].forEach(s => grid[5][s] = true);
          updateBpm(140);
        }
        buildGridUI();
      }

      // Initialize with Trap Preset
      loadPreset('trap');
    </script>
  </body>
</html>
