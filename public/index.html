<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0" />
    <title>Baddo Showdown Arcade</title>
    <style>
      * { box-sizing: border-box; touch-action: none; -webkit-touch-callout: none; user-select: none; }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        background: #020617;
        color: #f8fafc;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow: hidden;
      }
      .game-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        max-width: 420px;
        padding: 10px;
      }
      .top-hud {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        margin-bottom: 8px;
        font-weight: 800;
        font-size: 1rem;
      }
      .hud-score { color: #38bdf8; }
      .hud-best { color: #f59e0b; }
      .hud-health { color: #ef4444; }
      canvas {
        background: #0b1120;
        border: 2px solid #38bdf8;
        border-radius: 12px;
        box-shadow: 0 0 25px rgba(56, 189, 248, 0.25);
        display: block;
        cursor: grab;
      }
      canvas:active { cursor: grabbing; }
      .bar-controls {
        display: flex;
        gap: 8px;
        margin-top: 10px;
        width: 100%;
      }
      .btn {
        flex: 1;
        padding: 10px 0;
        font-size: 0.85rem;
        font-weight: 700;
        border-radius: 8px;
        cursor: pointer;
        border: 1px solid #334155;
        background: #1e293b;
        color: #f8fafc;
      }
      .btn:hover { background: #334155; }
      .btn-music-on { color: #4ade80; border-color: #22c55e; }
      .hint {
        font-size: 0.75rem;
        color: #64748b;
        margin-top: 6px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="game-wrapper">
      <div class="top-hud">
        <span>Score: <span id="scoreText" class="hud-score">0</span></span>
        <span>HP: <span id="hpText" class="hud-health">♥♥♥</span></span>
        <span>Best: <span id="bestText" class="hud-best">0</span></span>
      </div>

      <canvas id="gameCanvas" width="360" height="520"></canvas>

      <div class="bar-controls">
        <button class="btn" id="musicBtn" onclick="toggleMusic()">🎵 Music: OFF</button>
        <button class="btn" id="pauseBtn" onclick="togglePause()">⏸ Pause</button>
        <button class="btn" onclick="restartGame()">🔄 Restart</button>
      </div>

      <div class="hint">📱 Drag anywhere to move & auto-fire | 💻 Mouse drag or A/D keys</div>
    </div>

    <!-- Background Arcade Soundtrack URL -->
    <audio id="bgm" loop preload="auto">
      <source src="https://cdn.freesound.org/previews/563/563994_11861866-lq.mp3" type="audio/mp3">
    </audio>

    <script>
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const scoreText = document.getElementById('scoreText');
      const hpText = document.getElementById('hpText');
      const bestText = document.getElementById('bestText');
      const musicBtn = document.getElementById('musicBtn');
      const pauseBtn = document.getElementById('pauseBtn');
      const bgm = document.getElementById('bgm');
      bgm.volume = 0.35;

      let bestScore = localStorage.getItem('baddo_showdown_best') || 0;
      bestText.textContent = bestScore;

      let score = 0;
      let hp = 3;
      let gameOver = false;
      let isPaused = false;
      let isMusicPlaying = false;
      let frame = 0;

      // Player Character
      let player = {
        x: 180,
        y: 450,
        radius: 20,
        targetX: 180,
        targetY: 450,
        isFiring: false,
        shootCooldown: 0
      };

      let bullets = [];
      let enemyBullets = [];
      let enemies = [];
      let particles = [];

      // Audio Toggle
      function toggleMusic() {
        if (!isMusicPlaying) {
          bgm.play().then(() => {
            isMusicPlaying = true;
            musicBtn.textContent = '🎵 Music: ON';
            musicBtn.classList.add('btn-music-on');
          }).catch(() => {});
        } else {
          bgm.pause();
          isMusicPlaying = false;
          musicBtn.textContent = '🎵 Music: OFF';
          musicBtn.classList.remove('btn-music-on');
        }
      }

      // Drag Controls: Touch & Mouse
      function setPointerPosition(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        player.targetX = (clientX - rect.left) * scaleX;
        player.targetY = (clientY - rect.top) * scaleY;

        // Boundaries
        player.targetX = Math.max(player.radius, Math.min(canvas.width - player.radius, player.targetX));
        player.targetY = Math.max(player.radius + 60, Math.min(canvas.height - player.radius, player.targetY));
      }

      let isDragging = false;

      canvas.addEventListener('pointerdown', (e) => {
        isDragging = true;
        player.isFiring = true;
        setPointerPosition(e.clientX, e.clientY);
        if (gameOver) restartGame();
      });

      window.addEventListener('pointermove', (e) => {
        if (isDragging) {
          setPointerPosition(e.clientX, e.clientY);
        }
      });

      window.addEventListener('pointerup', () => {
        isDragging = false;
        player.isFiring = false;
      });

      // Keyboard Controls
      let keys = {};
      window.addEventListener('keydown', (e) => {
        keys[e.key] = true;
        if (e.key === ' ' || e.key === 'Spacebar') player.isFiring = true;
        if (e.key === 'p' || e.key === 'P') togglePause();
        if (e.key === 'r' || e.key === 'R') restartGame();
        if (gameOver && (e.key === 'Enter' || e.key === ' ')) restartGame();
      });
      window.addEventListener('keyup', (e) => {
        keys[e.key] = false;
        if (e.key === ' ' || e.key === 'Spacebar') player.isFiring = false;
      });

      function updateHealthUI() {
        hpText.textContent = '♥'.repeat(Math.max(0, hp));
      }

      function spawnEnemy() {
        const size = 34;
        const x = Math.random() * (canvas.width - size - 20) + 10;
        const speed = 1.4 + Math.min(score * 0.02, 3);
        enemies.push({
          x,
          y: -size,
          size,
          speed,
          shootCooldown: Math.floor(Math.random() * 60) + 40,
          wobbleOffset: Math.random() * Math.PI * 2
        });
      }

      function createExplosion(x, y, color) {
        for (let i = 0; i < 12; i++) {
          particles.push({
            x,
            y,
            vx: (Math.random() - 0.5) * 6,
            vy: (Math.random() - 0.5) * 6,
            size: Math.random() * 3 + 2,
            life: 25,
            color
          });
        }
      }

      function togglePause() {
        if (gameOver) return;
        isPaused = !isPaused;
        if (isPaused) {
          pauseBtn.textContent = '▶ Resume';
          if (isMusicPlaying) bgm.pause();
          drawPauseScreen();
        } else {
          pauseBtn.textContent = '⏸ Pause';
          if (isMusicPlaying) bgm.play().catch(() => {});
          requestAnimationFrame(gameLoop);
        }
      }

      function restartGame() {
        score = 0;
        hp = 3;
        player.x = 180;
        player.y = 450;
        player.targetX = 180;
        player.targetY = 450;
        bullets = [];
        enemyBullets = [];
        enemies = [];
        particles = [];
        gameOver = false;
        isPaused = false;
        scoreText.textContent = score;
        updateHealthUI();
        pauseBtn.textContent = '⏸ Pause';
        requestAnimationFrame(gameLoop);
      }

      function update() {
        // Smooth position glide to touch pointer
        player.x += (player.targetX - player.x) * 0.25;
        player.y += (player.targetY - player.y) * 0.25;

        // Keyboard movement overrides
        if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
          player.x = Math.max(player.radius, player.x - 6);
          player.targetX = player.x;
        }
        if (keys['ArrowRight'] || keys['d'] || keys['D']) {
          player.x = Math.min(canvas.width - player.radius, player.x + 6);
          player.targetX = player.x;
        }

        // Auto/Manual firing
        if (player.shootCooldown > 0) player.shootCooldown--;
        if (player.isFiring && player.shootCooldown === 0) {
          bullets.push({ x: player.x - 10, y: player.y - 15, vy: -10, color: '#38bdf8' });
          bullets.push({ x: player.x + 10, y: player.y - 15, vy: -10, color: '#38bdf8' });
          player.shootCooldown = 9;
        }

        // Update hero bullets
        for (let i = bullets.length - 1; i >= 0; i--) {
          bullets[i].y += bullets[i].vy;
          if (bullets[i].y < -20) bullets.splice(i, 1);
        }

        // Update enemy lasers
        for (let i = enemyBullets.length - 1; i >= 0; i--) {
          const eb = enemyBullets[i];
          eb.y += eb.vy;

          // Check hit against player
          const dist = Math.hypot(eb.x - player.x, eb.y - player.y);
          if (dist < player.radius + 4) {
            createExplosion(player.x, player.y, '#ef4444');
            enemyBullets.splice(i, 1);
            hp--;
            updateHealthUI();
            if (hp <= 0) triggerGameOver();
            continue;
          }

          if (eb.y > canvas.height + 20) enemyBullets.splice(i, 1);
        }

        // Spawn Baddos
        frame++;
        if (frame % Math.max(28, 65 - Math.floor(score * 0.3)) === 0) {
          spawnEnemy();
        }

        // Update Baddos
        for (let i = enemies.length - 1; i >= 0; i--) {
          const e = enemies[i];
          e.y += e.speed;
          e.x += Math.sin(frame * 0.05 + e.wobbleOffset) * 1.5;

          // Baddo shoots back
          e.shootCooldown--;
          if (e.shootCooldown <= 0) {
            enemyBullets.push({ x: e.x + e.size / 2, y: e.y + e.size, vy: 4.5, color: '#f87171' });
            e.shootCooldown = Math.floor(Math.random() * 80) + 60;
          }

          // Check player laser hit
          for (let j = bullets.length - 1; j >= 0; j--) {
            const b = bullets[j];
            if (b.x > e.x && b.x < e.x + e.size && b.y > e.y && b.y < e.y + e.size) {
              createExplosion(e.x + e.size / 2, e.y + e.size / 2, '#38bdf8');
              enemies.splice(i, 1);
              bullets.splice(j, 1);
              score += 15;
              scoreText.textContent = score;
              break;
            }
          }

          // Direct collision with player
          if (
            e &&
            player.x + player.radius > e.x &&
            player.x - player.radius < e.x + e.size &&
            player.y + player.radius > e.y &&
            player.y - player.radius < e.y + e.size
          ) {
            createExplosion(player.x, player.y, '#ef4444');
            enemies.splice(i, 1);
            hp--;
            updateHealthUI();
            if (hp <= 0) triggerGameOver();
          }

          if (e && e.y > canvas.height + 40) enemies.splice(i, 1);
        }

        // Particles
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.life--;
          if (p.life <= 0) particles.splice(i, 1);
        }
      }

      function triggerGameOver() {
        gameOver = true;
        if (score > bestScore) {
          bestScore = score;
          localStorage.setItem('baddo_showdown_best', bestScore);
          bestText.textContent = bestScore;
        }
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Starfield backdrop
        ctx.fillStyle = '#1e293b';
        for (let i = 0; i < 20; i++) {
          const sx = (i * 37 + frame) % canvas.width;
          const sy = (i * 53 + frame * 2) % canvas.height;
          ctx.fillRect(sx, sy, 2, 2);
        }

        // Player Bullets
        ctx.fillStyle = '#38bdf8';
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#38bdf8';
        bullets.forEach((b) => ctx.fillRect(b.x - 2, b.y, 4, 12));

        // Enemy Bullets
        ctx.fillStyle = '#f87171';
        ctx.shadowColor = '#ef4444';
        enemyBullets.forEach((eb) => {
          ctx.beginPath();
          ctx.arc(eb.x, eb.y, 4, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.shadowBlur = 0;

        // Draw Player Character (Armored Cyber Hero)
        ctx.save();
        ctx.translate(player.x, player.y);

        // Thruster flame
        ctx.fillStyle = '#f59e0b';
        ctx.beginPath();
        ctx.moveTo(-6, 16);
        ctx.lineTo(0, 26 + (frame % 4) * 2);
        ctx.lineTo(6, 16);
        ctx.fill();

        // Ship hull
        ctx.fillStyle = '#0284c7';
        ctx.beginPath();
        ctx.moveTo(0, -18);
        ctx.lineTo(18, 14);
        ctx.lineTo(-18, 14);
        ctx.closePath();
        ctx.fill();

        // Cockpit visor
        ctx.fillStyle = '#38bdf8';
        ctx.beginPath();
        ctx.arc(0, 0, 7, 0, Math.PI * 2);
        ctx.fill();

        // Twin cannons
        ctx.fillStyle = '#94a3b8';
        ctx.fillRect(-14, -6, 4, 16);
        ctx.fillRect(10, -6, 4, 16);
        ctx.restore();

        // Draw Baddo Characters (Visored Bandit Invaders)
        enemies.forEach((e) => {
          ctx.save();
          ctx.translate(e.x, e.y);

          // Helmet / Skull
          ctx.fillStyle = '#dc2626';
          ctx.beginPath();
          ctx.roundRect(0, 0, e.size, e.size - 4, 8);
          ctx.fill();

          // Cyber Eyepiece / Visor
          ctx.fillStyle = '#0f172a';
          ctx.fillRect(4, 8, e.size - 8, 8);
          ctx.fillStyle = '#facc15';
          ctx.fillRect(8, 10, 8, 4);

          // Jaw Guard
          ctx.fillStyle = '#475569';
          ctx.fillRect(6, 20, e.size - 12, 6);

          ctx.restore();
        });

        // Sparks & Explosions
        particles.forEach((p) => {
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x, p.y, p.size, p.size);
        });

        // Game Over Screen
        if (gameOver) {
          ctx.fillStyle = 'rgba(2, 6, 23, 0.88)';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          ctx.fillStyle = '#ef4444';
          ctx.font = 'bold 28px system-ui';
          ctx.textAlign = 'center';
          ctx.fillText('MISSION FAILED', canvas.width / 2, 210);

          ctx.fillStyle = '#f8fafc';
          ctx.font = '16px system-ui';
          ctx.fillText('Baddos Defeated: ' + score, canvas.width / 2, 248);

          ctx.fillStyle = '#38bdf8';
          ctx.font = '14px system-ui';
          ctx.fillText('Tap screen or click Restart', canvas.width / 2, 285);
        }
      }

      function drawPauseScreen() {
        ctx.fillStyle = 'rgba(2, 6, 23, 0.75)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 28px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText('PAUSED', canvas.width / 2, 230);

        ctx.fillStyle = '#94a3b8';
        ctx.font = '14px system-ui';
        ctx.fillText('Tap Resume or press P to continue', canvas.width / 2, 260);
      }

      function gameLoop() {
        if (!gameOver && !isPaused) {
          update();
          draw();
          requestAnimationFrame(gameLoop);
        }
      }

      updateHealthUI();
      requestAnimationFrame(gameLoop);
    </script>
  </body>
</html>
